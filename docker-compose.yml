services:
  api:
    build: .
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      DATABASE_PATH: /data/cofresenhas.db
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-troque-este-segredo-em-producao}
      PORT: 5000
    volumes:
      - api-data:/data

  frontend:
    build: ./frontend
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  api-data:
