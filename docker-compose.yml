services:
  api:
    build: .
    restart: unless-stopped
    ports:
      # Só local: o frontend fala com a API por http://api:5000 na rede interna do Docker; ninguém na LAN precisa da porta da API
      # (antes aberta em 0.0.0.0 com CORS liberado). O monitor do Kuma que usava a 5012 deve apontar para a porta do frontend.
      - "127.0.0.1:${API_PORT:-5000}:5000"
    environment:
      DATABASE_PATH: /data/cofresenhas.db
      # Segredos vêm de arquivos (Docker secrets), não do ambiente do container:
      # não aparecem em `docker inspect` nem em /proc/<pid>/environ.
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ENCRYPTION_SECRET_FILE: /run/secrets/encryption_secret
      PORT: 5000
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cofre.hoffserv.lan}
    volumes:
      - api-data:/data
    secrets:
      - jwt_secret
      - encryption_secret
    # Sem root: uid 10001 dono do volume api-data (chown feito em 14/11/2026), sem capabilities e sem ganhar privilégios.
    # Reverter: tirar as 3 linhas abaixo e `chown -R 0:0` no volume (backup do banco em backups-manuais/).
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    # Sem curl/wget na imagem — usa o /dev/tcp do bash pra checar se a porta responde.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # Imagem só existe local (build local) — sem isso o Watchtower tenta um pull
      # todo dia e falha sempre ("pull access denied"), poluindo o log.
      - com.centurylinklabs.watchtower.enable=false

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      - api
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - com.centurylinklabs.watchtower.enable=false

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  encryption_secret:
    file: ./secrets/encryption_secret

volumes:
  api-data:
