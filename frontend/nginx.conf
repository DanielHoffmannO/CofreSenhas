server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # IP real do cliente: só confia no X-Forwarded-For vindo do proxy (rede
    # Docker); um cabeçalho forjado por quem fala direto não vira IP de cliente.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Cabeçalhos de segurança (valem para todas as respostas sem add_header próprio)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://api:5000/api/;
        # A API usa este valor no limite de tentativas de login: sempre o IP
        # já validado acima, nunca o cabeçalho cru do cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
